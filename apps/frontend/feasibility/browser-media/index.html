<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CL-005 local media feasibility</title>
    <style>
      body {
        margin: 24px;
        color: #171d2b;
        background: #f5f7fc;
        font: 15px system-ui;
      }
      button {
        margin-right: 8px;
        padding: 10px 16px;
        border: 1px solid #cbd3e5;
        border-radius: 6px;
        background: white;
        cursor: pointer;
      }
      pre {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        line-height: 1.5;
      }
      video {
        max-height: 380px;
        max-width: 100%;
        background: #141b29;
      }
    </style>
  </head>
  <body>
    <h1>CL-005 local media feasibility</h1>
    <button id="probe">Probe and encode small sample</button>
    <button id="reopen">Reopen retained sample</button>
    <button id="generate">Generate full-bound source</button>
    <button id="short-source">Generate 20-second intake fixture</button>
    <button id="extract">Extract all source audio</button>
    <button id="audio-candidate">CL-006 worker Opus extraction</button>
    <button id="audio-reference">CL-006 worker PCM reference</button>
    <button id="audio-failure">CL-006 partial audio write failure</button>
    <button id="export">Export a 60-second portrait range</button>
    <button id="range">Preview the immutable source range</button>
    <button id="seek">Seek to range end</button>
    <button id="memory">Measure idle app memory</button>
    <button id="bound">Bound the AAC presentation duration</button>
    <button id="sync">Validate output flash and tone sync</button>
    <button id="copy">Copy, reopen, and delete source copy</button>
    <button id="failure">Inject a mid-write failure</button>
    <button id="hold">Hold workspace lock</button>
    <button id="release">Release workspace lock</button>
    <button id="play">Play preview</button>
    <button id="cancel">Cancel current work</button>
    <button id="clean">Delete spike artifacts</button>
    <p id="phase" role="status">Ready</p>
    <video id="preview" controls playsinline></video>
    <a id="download-source" hidden download="synthetic-intake.mp4"
      >Download synthetic fixture</a
    >
    <pre id="results" aria-label="Measurement results"></pre>
    <script type="module" src="/main.mjs"></script>
  </body>
</html>
