name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - "22"
          - "24"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run deterministic unit tests
        run: pnpm test:unit
        env:
          NODE_ENV: test
          PROVIDER_MODE: fake
          PAID_DEMO_ENABLED: "false"
          LIVE_UPLOAD_ENABLED: "false"
          LIVE_ANALYSIS_ENABLED: "false"
          LIVE_ASSEMBLY_ENABLED: "false"
          LIVE_IMAGE_GENERATION_ENABLED: "false"
          LIVE_EDIT_ASSISTANT_ENABLED: "false"
          LIVE_RENDER_ENABLED: "false"

      - name: Build
        run: pnpm build
